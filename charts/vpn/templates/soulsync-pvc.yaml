{{- range $key, $_ := .Values.soulsync.pvcs }}
# https://kubernetes.io/docs/concepts/storage/persistent-volumes/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ include "vpn.pvc" (dict "root" $ "name" $key) }}"
  namespace: "{{ $.Release.Namespace }}"
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: "{{ .storage }}"
---
{{- end }}
