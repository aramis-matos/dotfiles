# https://kubernetes.io/docs/concepts/configuration/secret/
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "vpn.secret" (dict "root" $ "name" .Values.soulsync.config.name) }}"
  namespace: "{{ .Release.Name }}"
type: Opaque
stringData:
  "{{ .Values.soulsync.config.key }}": |
    "{{- required "Soulsync config is not set. Please set .Values.soulsync.config.value" .Values.soulsync.config.value | nindent 4 }}"
---

